<!DOCTYPE html>
<html class="wide wow-animation" lang="en">
  <head>
    <title>Register</title>
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta charset="utf-8">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="//fonts.googleapis.com/css?family=Nunito+Sans:300,400,700%7CRaleway:400,500,700%7CPlayfair+Display:400,700,700i,900i">
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/style.css">
		
  <link rel="stylesheet" 
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
  <body>
    <div class="page">
      <div class="page-loader page-loader-variant-1">
        <div><a class="brand brand-md" href="index.html"><img src="images/logo-124x45.png" alt="" width="124" height="45"/></a>
          <div class="page-loader-body">
            <div id="spinningSquaresG">
              <div class="spinningSquaresG" id="spinningSquaresG_1"></div>
              <div class="spinningSquaresG" id="spinningSquaresG_2"></div>
              <div class="spinningSquaresG" id="spinningSquaresG_3"></div>
              <div class="spinningSquaresG" id="spinningSquaresG_4"></div>
              <div class="spinningSquaresG" id="spinningSquaresG_5"></div>
              <div class="spinningSquaresG" id="spinningSquaresG_6"></div>
              <div class="spinningSquaresG" id="spinningSquaresG_7"></div>
              <div class="spinningSquaresG" id="spinningSquaresG_8"></div>
            </div>
          </div>
        </div>
      </div>
      <section class="section section-single novi-background bg-gray-darker novi-background" style="background-image: url(images/bg-image-5.jpg);">
        <div class="section-single-inner">
          <header class="section-single-header">
            <div class="divider divider-wide bg-accent"></div>
            <div class="page-head-inner">
              <div class="container text-center"><a class="brand" href="index.html"><img src="images/logo-inverse-124x45.png" alt="" width="124" height="45"/></a></div>
            </div>
          </header>
          <div class="section-single-main">
            <div class="container">
              <div class="row justify-content-md-center">
                <div class="col-md-7 col-lg-5 col-xl-4">
                  <div class="block-shadow text-center">
                    <div class="block-inner">
                      <p class="h7">Create your account</p>
                      <div class="icon-block"><span class="icon icon-xl icon-black material-icons-face"></span></div>
                    </div>
                    <form class="rd-mailform form-modern form-darker form-login">
                      <div class="block-inner">
                        <div class="form-wrap">
                          <input class="form-input" id="register-form-name" type="text" name="name" data-constraints="@Required">
                          <label class="form-label" for="register-form-name">Username</label>
                        </div>
                        <div class="form-wrap">
                          <input class="form-input" id="feedback-email" type="email" name="email" data-constraints="@Email @Required">
                          <label class="form-label" for="feedback-email">Email</label>
                        </div>
                        <div class="form-wrap">
                          <input class="form-input" id="register-form-password" type="password" name="pass" data-constraints="@Required">
                          <label class="form-label" for="register-form-password">Password</label>
                        </div>
                        <div class="form-wrap">
                          <input class="form-input" id="register-form-password-confirm" type="password" name="pass-confirm" data-constraints="@Required">
                          <label class="form-label" for="register-form-password-confirm">Repeat a password</label>
                        </div>
                        <div class="info-text text-start">
                          <label class="checkbox-inline checkbox-small text-gray">
                            <input name="input-checkbox" value="checkbox-1" type="checkbox">I agree with the&nbsp;<a class="link-primary-inline" href="privacy-policy.html">Terms of use</a>.
                          </label>
                        </div>
                      </div>
                      <button class="btn btn-primary btn-round-bottom btn-block" type="submit">Sign up</button>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="section-single-footer">
            <div class="container text-center">
              <div class="row">
                <div class="col-sm-12">
                  <p class="rights small"><span>TaxAdvisor</span><span>&nbsp;&#169;&nbsp;</span><span class="copyright-year"></span><span>All Rights Reserved</span><br class="d-md-none"><a class="link-primary-inverse" href="#">Terms of Use</a><span>and</span><a class="link-primary-inverse" href="privacy-policy.html">Privacy Policy</a></p>
                </div>
              </div>
            </div>
            <div class="divider divider-wide bg-accent"></div>
          </div>

        </div>
      </section>
    </div>
    <div class="snackbars" id="form-output-global"></div>
    <script src="js/core.min.js"></script>
    <script src="js/script.js"></script>
    <!-- coded by retoyfer-->
  </body>
</html>
