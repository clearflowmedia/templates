<!DOCTYPE html>
<html class="wide wow-animation" lang="en">
  <head>
    <title>Login</title>
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta charset="utf-8">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="//fonts.googleapis.com/css?family=Montserrat:400,700%7CLato:300,300italic,400,400italic,700italic,800%7CQuicksand:400,700">
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/style.css">
		
  <link rel="stylesheet" 
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
  <body>
    <div class="page">
      <div class="page-loader page-loader-variant-1">
        <div><a class="brand brand-md brand-inverse" href="index.html"><img src="images/logo-white-135x45.png" alt="" width="135" height="45"/></a>
          <div class="page-loader-body">
            <div id="spinningSquaresG">
              <div class="spinningSquaresG" id="spinningSquaresG_1"></div>
              <div class="spinningSquaresG" id="spinningSquaresG_2"></div>
              <div class="spinningSquaresG" id="spinningSquaresG_3"></div>
              <div class="spinningSquaresG" id="spinningSquaresG_4"></div>
              <div class="spinningSquaresG" id="spinningSquaresG_5"></div>
              <div class="spinningSquaresG" id="spinningSquaresG_6"></div>
              <div class="spinningSquaresG" id="spinningSquaresG_7"></div>
              <div class="spinningSquaresG" id="spinningSquaresG_8"></div>
            </div>
          </div>
        </div>
      </div>
      <section class="section section-single novi-background bg-gray-darker novi-background" style="background-image: url(images/bg-login.jpg);">
        <div class="section-single-inner">
          <header class="section-single-header">
            <div class="page-head-inner">
              <div class="container text-center"><a class="brand brand-md brand-inverse" href="index.html"><img src="images/logo-light-166x42.png" alt="" width="166" height="42"/></a></div>
            </div>
          </header>
          <div class="section-single-main">
            <div class="container">
              <div class="row justify-content-md-center">
                <div class="col-md-7 col-lg-5 col-xl-4">
                  <div class="block-shadow">
                    <div class="block-inner">
                      <p class="text-uppercase fw-bold text-dark">Login to your account</p><span class="novi-icon icon icon-xl icon-black block-icon material-icons-lock_open"></span>
                    </div>
                    <form class="rd-mailform form-modern form-darker form-disabled">
                      <div class="block-inner">
                        <div class="form-wrap">
                          <input class="form-input" id="login-form-login" type="text" name="login" data-constraints="@Required">
                          <label class="form-label" for="login-form-login">Login</label>
                        </div>
                        <div class="form-wrap">
                          <input class="form-input" id="login-form-password" type="password" name="pass" data-constraints="@Required">
                          <label class="form-label" for="login-form-password">Password</label>
                        </div>
                        <div class="form-wrap"><a class="text-gray-05" href="#">Forgot your password?</a></div>
                      </div>
                      <button class="btn btn-primary btn-block" type="submit">Sign in</button>
                    </form>
                  </div>
                  <div class="group-inline text-center"><span>Don’t have an account?</span><a class="link link-primary-inverse" href="register.html">Sign up here.</a></div>
                </div>
              </div>
            </div>
          </div>
          <div class="section-single-footer">
            <div class="container text-center">
              <div class="row">
                <div class="col-12">
                  <p class="rights"><span>InvestPlus</span><span>&nbsp;&#169;&nbsp;</span><span class="copyright-year"></span><span>All Rights Reserved</span><br class="d-md-none"><a class="link-primary-inverse" href="#">Terms of Use</a><span>and</span><a class="link-primary-inverse" href="privacy-policy.html">Privacy Policy</a></p>
                </div>
              </div>
            </div>
          </div>

        </div>
      </section>
    </div>
    <div class="snackbars" id="form-output-global"></div>
    <script src="js/core.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
