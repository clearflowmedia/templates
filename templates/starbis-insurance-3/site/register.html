<!DOCTYPE html>
<html class="wide wow-animation" lang="en">
  <head>
    <title>Create your account</title>
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta charset="utf-8">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="//fonts.googleapis.com/css?family=Exo:400,400i,700,700i%7CHind:300,300italic,400,400italic,700,900%7CPlayfair+Display:700italic,900">
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/style.css">
		
  <link rel="stylesheet" 
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
  <body>
    <div class="page">
      <div class="page-loader page-loader-variant-1">
        <div class="page-loader-body">
          <div class="cube-wrapper">
            <div class="cube-folding"><span class="leaf1"></span><span class="leaf2"></span><span class="leaf3"></span><span class="leaf4"></span></div>
          </div>
        </div>
      </div>
      <section class="section section-single novi-background bg-gray-darker" style="background-image: url(images/bg-login.jpg);">
        <div class="section-single-inner">
          <header class="section-single-header">
            <div class="divider-wide"></div>
            <div class="page-head-inner">
              <div class="container text-center"><a class="brand brand-md brand-inverse" href="index.html"><img src="images/brand-inverse.png" alt=""></a></div>
            </div>
          </header>
          <div class="section-single-main">
            <div class="container">
              <div class="row justify-content-md-center">
                <div class="col-md-7 col-lg-5 col-xl-4">
                  <div class="block-shadow text-center">
                    <div class="block-inner">
                      <p class="h7 fw-bold text-abbey">Create your account</p>
                      <div class="icon-block"><span class="icon icon-xl icon-black material-icons-face"></span></div>
                    </div>
                    <form class="rd-mailform form-modern form-darker form-login">
                      <div class="block-inner">
                        <div class="form-wrap">
                          <input class="form-input" id="register-form-name" type="text" name="name" data-constraints="@Required">
                          <label class="form-label" for="register-form-name">Username</label>
                        </div>
                        <div class="form-wrap">
                          <input class="form-input" id="feedback-email" type="email" name="email" data-constraints="@Email @Required">
                          <label class="form-label" for="feedback-email">Email</label>
                        </div>
                        <div class="form-wrap">
                          <input class="form-input" id="register-form-password" type="password" name="pass" data-constraints="@Required">
                          <label class="form-label" for="register-form-password">Password</label>
                        </div>
                        <div class="form-wrap">
                          <input class="form-input" id="register-form-password-confirm" type="password" name="pass-confirm" data-constraints="@Required">
                          <label class="form-label" for="register-form-password-confirm">Repeat a password</label>
                        </div>
                        <div class="info-text text-start">
                          <label class="checkbox-inline checkbox-small text-gray">
                            <input name="input-checkbox" value="checkbox-1" type="checkbox">I agree with the&nbsp;<a class="link-primary-inline" href="privacy.html">Terms of use</a>.
                          </label>
                        </div>
                      </div>
                      <button class="btn btn-primary btn-block" type="submit">Sign up</button>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="section-single-footer">
            <div class="container text-center">
              <div class="container text-center">
                <p class="rights"><span>&nbsp;&#169;&nbsp;</span><span class="copyright-year"></span><span>ShieldGroup</span><a class="link-primary-inverse" href="privacy.html">Privacy Policy</a></p>
              </div>
            </div>
            <div class="divider-wide"></div>
          </div>

        </div>
      </section>
    </div>
    <div class="snackbars" id="form-output-global"></div>
    <script src="js/core.min.js"></script>
    <script src="js/script.js"></script>
    <!-- coded by retoyfer-->
  </body>
</html>
